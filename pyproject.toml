[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-publisher"
version = "0.1.0"
description = "Scheduled Google Drive to Gemini to Facebook and Instagram publishing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-genai>=1.30,<2",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
social-publisher = "social_media_publisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
